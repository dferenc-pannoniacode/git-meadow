name: Publish Docker image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-release
  queue: max

jobs:
  publish:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release
        run: |
          number='(0|[1-9][0-9]*)'
          version_pattern="^v${number}\.${number}\.${number}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $version_pattern || ${#GITHUB_REF_NAME} -gt 128 ]]; then
            echo '::error::Use a release tag such as v1.2.3 or v1.2.3-rc.1.'
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The tagged commit must be on main before the release tag is pushed.'
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push image
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "${image}:${GITHUB_REF_NAME}")
          if [[ "$APP_VERSION" != *-* ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx build --push \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${APP_VERSION}" \
            "${tags[@]}" \
            .
